name: Build VisionWhats APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Criar projeto e gerar APK
        run: |
          cp lib/main.dart /tmp/vision_main.dart
          flutter create . --project-name visionwhats --org com.visionwhats.app
          cp /tmp/vision_main.dart lib/main.dart
          rm -f test/widget_test.dart
          flutter pub add "supabase_flutter:^2.18.3" "flutter_contacts:^1.1.9+2" shared_preferences flutter_tts translator
          python3 -c 'import re; p="android/app/src/main/AndroidManifest.xml"; t=open(p).read(); t=re.sub(r"android:label=\"[^\"]*\"","android:label=\"VisionWhats\"",t,1); perms=""; perms+="<uses-permission android:name=\"android.permission.INTERNET\"/>"+chr(10) if "INTERNET" not in t else ""; perms+="<uses-permission android:name=\"android.permission.READ_CONTACTS\"/>"+chr(10) if "READ_CONTACTS" not in t else ""; t=t.replace("<application",perms+"<application",1); t=t.replace("</manifest>","<queries><intent><action android:name=\"android.intent.action.TTS_SERVICE\"/></intent></queries>"+chr(10)+"</manifest>",1) if "TTS_SERVICE" not in t else t; open(p,"w").write(t)'
          flutter build apk --release

      - name: Publicar APK direto na pagina Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VisionWhats.apk
          gh release delete v2.0 --cleanup-tag --yes || true
          gh release create v2.0 VisionWhats.apk --title "VisionWhats v2.0 (Contatos + Chat Real)" --notes "Toque em VisionWhats.apk abaixo para baixar e instalar!"
